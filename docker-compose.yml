services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: taxlens
      POSTGRES_PASSWORD: taxlens
      POSTGRES_DB: taxlens
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      TAXLENS_DATABASE_URL: postgresql+psycopg://taxlens:taxlens@db:5432/taxlens
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
